services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: locman
      POSTGRES_PASSWORD: locman_dev
      POSTGRES_DB: ai_locman
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../backend/db/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ../backend/db/002_project_memory.sql:/docker-entrypoint-initdb.d/002_project_memory.sql:ro
      - ../backend/db/003_agent_tasks.sql:/docker-entrypoint-initdb.d/003_agent_tasks.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locman -d ai_locman"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev"
    volumes:
      - ../backend:/workspace
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://locman:locman_dev@postgres:5432/ai_locman
      REDIS_URL: redis://redis:6379
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  agent-worker:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run worker"
    volumes:
      - ../backend:/workspace
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://locman:locman_dev@postgres:5432/ai_locman
      REDIS_URL: redis://redis:6379
      AGENT_WORKER_CONCURRENCY: 2
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
