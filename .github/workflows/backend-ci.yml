name: Backend CI
on:
  push:
    paths: ["backend/**", "agent-core/**", "infrastructure/**", "build-workers/**", "README.md", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", "agent-core/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local infrastructure YAML
        run: ruby -e 'require "yaml"; YAML.load_file("infrastructure/docker-compose.yml")'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend install, audit, typecheck and tests
        working-directory: backend
        run: npm install && npm audit --audit-level=high && npm run typecheck && npm test
      - name: Agent install, audit and typecheck
        working-directory: agent-core
        run: npm install && npm audit --audit-level=high && npm run typecheck
